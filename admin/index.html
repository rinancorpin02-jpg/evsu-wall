<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVSU Freedom Wall · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <div class="paper-grain" aria-hidden="true"></div>

    <section id="login-view" class="login-view">
      <header class="topbar">
        <div class="brand">
          <span class="crest">EV</span>
          <div>
            <p class="kicker">Admin review</p>
            <h1>Freedom Wall</h1>
          </div>
        </div>
      </header>
      <form id="login-form" class="login-card">
        <h2>Sign in to review notes</h2>
        <p class="sub">Only approved messages go on the public wall.</p>
        <label>
          Username
          <input id="username" name="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Enter</button>
        <p id="login-status" class="status" role="status"></p>
      </form>
    </section>

    <section id="dashboard-view" class="dashboard hidden">
      <header class="topbar">
        <div class="brand">
          <span class="crest">EV</span>
          <div>
            <p class="kicker">Admin review</p>
            <h1>Submitted messages</h1>
          </div>
        </div>
        <div class="header-actions">
          <a class="ghost" href="/" target="_blank" rel="noreferrer">Open public wall</a>
          <button id="logout-btn" type="button" class="ghost">Log out</button>
        </div>
      </header>

      <div id="counts" class="counts"></div>
      <div class="toolbar">
        <button type="button" data-filter="pending" class="filter active">Pending</button>
        <button type="button" data-filter="approved" class="filter">Approved</button>
        <button type="button" data-filter="rejected" class="filter">Rejected</button>
        <button type="button" data-filter="all" class="filter">All</button>
      </div>
      <div id="queue" class="queue"></div>
    </section>

    <dialog id="delete-dialog" class="confirm-dialog">
      <form method="dialog" class="confirm-card">
        <h2>Delete this note?</h2>
        <p class="sub">This cannot be undone. The note will be removed from the queue and the wall.</p>
        <p id="delete-preview" class="confirm-preview"></p>
        <div class="confirm-actions">
          <button type="submit" value="cancel" class="ghost">Keep it</button>
          <button type="submit" value="delete" class="delete-confirm">Delete</button>
        </div>
      </form>
    </dialog>
    <script src="/admin/app.js"></script>
  </body>
</html>
